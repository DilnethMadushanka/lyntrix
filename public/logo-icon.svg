<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circuit nodes -->
  <circle cx="15" cy="30" r="3" fill="#38bdf8" />
  <circle cx="15" cy="50" r="3" fill="#38bdf8" />
  <circle cx="15" cy="70" r="3" fill="#38bdf8" />
  
  <path d="M15 30 H28 L35 38" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <path d="M15 50 H32" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <path d="M15 70 H24 L35 59" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />

  <!-- L & T stylized overlay -->
  <path d="M32 25 L48 25 L38 75 H28 Z" fill="url(#silver)" />
  <path d="M35 38 H52 V44 H43 L38 75 H32 Z" fill="#94a3b8" />

  <!-- Main X shape with circuit lines -->
  <path d="M42 20 L85 80 H68 L36 34 Z" fill="url(#grad1)" filter="url(#glow)" />
  <path d="M78 20 L40 75 H55 L88 28 Z" fill="url(#silver)" />

  <!-- Circuit dots on X -->
  <circle cx="68" cy="35" r="2.5" fill="#38bdf8" />
  <circle cx="75" cy="45" r="2.5" fill="#38bdf8" />
  <line x1="68" y1="35" x2="75" y2="45" stroke="#38bdf8" stroke-width="1.5" />
</svg>
